name: Automatizacion Hidrometrica

on:
  schedule:
    # Cada 4 horas (6 veces al día): 00:00, 04:00, 08:00, 12:00, 16:00 y 20:00 UTC
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite ejecutarlo a mano con un botón

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install requests beautifulsoup4

      - name: Ejecutar el Scraper
        env:
          # La PNA bloquea las IP de los runners: el scraper detecta esta
          # variable y sale por ScraperAPI. En local, sin la variable, va directo.
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          # CallMeBot: varios destinatarios van separados por coma, en el
          # mismo orden en TELEFONO_WA y APIKEY_WA.
          TELEFONO_WA: ${{ secrets.TELEFONO_WA }}
          APIKEY_WA: ${{ secrets.APIKEY_WA }}
        run: python backend/scraper.py

      - name: Guardar los datos nuevos
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add history.json
          git add alertas.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de alturas" && git push)